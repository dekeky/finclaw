<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f6fb" />
    <link rel="icon" type="image/png" href="/branding/finclaw-mark.png" />
    <link rel="shortcut icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/branding/finclaw-mark.png" />
    <title>Finclaw</title>
    <style>
      /* 首屏占位：React 挂载前先渲染一个居中加载指示，避免白屏 */
      html,
      body {
        margin: 0;
        height: 100%;
      }
      #root {
        min-height: 100%;
      }
      .fc-boot {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f7f7f8;
      }
      .dark .fc-boot {
        background: #17171a;
      }
      .fc-boot-spinner {
        width: 22px;
        height: 22px;
        border-radius: 50%;
        border: 2px solid rgba(139, 92, 246, 0.25);
        border-top-color: rgb(139, 92, 246);
        animation: fc-boot-spin 0.8s linear infinite;
      }
      @keyframes fc-boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
    <script>
      try {
        if (localStorage.getItem('finclaw.theme') === 'dark') {
          document.documentElement.classList.add('dark')
          document.documentElement.style.colorScheme = 'dark'
        }
      } catch (_) {}
    </script>
    <script>
      ;(function () {
        var key = 'finclaw.chunk-reload'
        function shouldReload(msg) {
          if (!msg) return false
          return (
            msg.indexOf('Failed to fetch dynamically imported module') !== -1 ||
            msg.indexOf('Importing a module script failed') !== -1 ||
            msg.indexOf('error loading dynamically imported module') !== -1
          )
        }
        window.addEventListener(
          'error',
          function (event) {
            var msg = event && event.message
            if (!shouldReload(msg)) return
            if (sessionStorage.getItem(key)) return
            sessionStorage.setItem(key, '1')
            window.location.reload()
          },
          true,
        )
        window.addEventListener('unhandledrejection', function (event) {
          var reason = event && event.reason
          var msg = typeof reason === 'string' ? reason : reason && reason.message
          if (!shouldReload(msg)) return
          if (sessionStorage.getItem(key)) return
          sessionStorage.setItem(key, '1')
          window.location.reload()
        })
        window.addEventListener('load', function () {
          sessionStorage.removeItem(key)
        })
      })()
    </script>
    <script type="module" crossorigin src="/assets/index-Bj62KU5F.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/monaco-C6M84PYe.css">
    <link rel="stylesheet" crossorigin href="/assets/index-BKmEZ-Iy.css">
  </head>
  <body>
    <div id="root">
      <div class="fc-boot">
        <div class="fc-boot-spinner"></div>
      </div>
    </div>
  </body>
</html>
